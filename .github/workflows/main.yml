name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Cấp quyền thực thi cho Gradle Wrapper
      run: chmod +x ./Vrace-fake-gps-main/gradlew

    - name: Tiến hành Build file APK (Debug)
      run: ./Vrace-fake-gps-main/gradlew assembleDebug --project-dir ./Vrace-fake-gps-main

    - name: Tải file APK lên Artifacts để tải về
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: ./Vrace-fake-gps-main/app/build/outputs/apk/debug/app-debug.apk
